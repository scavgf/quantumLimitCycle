# Small pipeline check only; different physics from manuscript production.
[model]
omega0 = 1.0
epsilon = 0.6
gamma_up = 1.0
gamma_down = 0.2
kappa = 0.02
[numerics]
N = 80
K = 5
husimi_grid = 31
bures_angles = 16
nev = 8
tol = 1e-8
maxiter = 4000
seed = 1234
[observations]
times = [0.0, 1.0, 4.0, 5.0]
bures_time = 4.0
phase_harmonics = [1, 3, 5]
phase_points = 25

# Gaussian initial-state settings. Omit sigma to match the evolved projected variance.
[positivity]
scope = "orbit"
psd_tolerance = 1e-10
trace_tolerance = 1e-8
# match_time = 4.0 # Age of the projected seed when the Gaussian clock starts.
# sigma = 1.0
precision_accuracy = 1e-6
search_steps = 18
theta_grid = 32
theta_grid_max = 256
certificate_margin = 1e-9
