# Physical parameters from the supplied manuscript's Fig. 1 caption.
[model]
omega0 = 1.0
epsilon = 0.6
gamma_up = 1.0
gamma_down = 0.2
kappa = 0.002

[numerics]
# Starting values, not a certified convergence result. Increase N and K to check.
N = 450
K = 30
husimi_grid = 301
bures_angles = 48
nev = 8
tol = 1e-8
maxiter = 4000
seed = 1234

[observations]
times = [0.0, 5.0, 10.0, 20.0, 30.0]
bures_time = 5.0
phase_harmonics = [1, 5, 10]
phase_points = 121

# Gaussian initial-state settings. Omit sigma to match the evolved projected variance.
[positivity]
#scope = "orbit"
scope="reference"
psd_tolerance = 1e-4
trace_tolerance = 1e-8
match_time = 1.5 # Age of the projected seed when the Gaussian clock starts.
# sigma = 1.0
precision_accuracy = 1e-6
search_steps = 18
theta_grid = 32
theta_grid_max =256
certificate_margin = 1e-9
